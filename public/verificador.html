<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassControl - Verificador de Configuración</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #d4d9e3;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: #3b82f6; margin-bottom: 10px; }
        .check-item { 
            background: #1a1f35; 
            border: 1px solid #2d3548; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .check-item.success { border-left: 4px solid #10b981; }
        .check-item.error { border-left: 4px solid #ef4444; }
        .check-item.warning { border-left: 4px solid #f59e0b; }
        .status { font-size: 24px; }
        .details { flex: 1; }
        .label { font-weight: 600; color: #3b82f6; }
        .value { color: #9ca3af; font-size: 14px; margin-top: 5px; word-break: break-all; }
        .button-group { 
            margin-top: 30px; 
            display: flex; 
            gap: 10px;
            flex-wrap: wrap;
        }
        button { 
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        .summary { 
            background: #1a1f35; 
            border: 1px solid #2d3548; 
            border-radius: 8px; 
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .summary.success { border-left: 4px solid #10b981; }
        .summary.error { border-left: 4px solid #ef4444; }
        code { 
            background: #0a0e1a; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: 'Courier New', monospace;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Verificador de Configuración</h1>
            <p>Comprueba que el proyecto esté configurado correctamente para funcionar desde cualquier carpeta</p>
        </div>

        <div id="checks"></div>

        <div class="button-group">
            <button onclick="runAllChecks()">🔄 Ejecutar Verificación</button>
            <button class="danger" onclick="runApiTest()">🌐 Prueba API de Login</button>
        </div>

        <div id="summary" class="summary" style="display:none;"></div>
    </div>

    <script>
        const checks = [];

        function addCheck(name, status, details) {
            checks.push({ name, status, details });
            renderChecks();
        }

        function renderChecks() {
            const container = document.getElementById('checks');
            container.innerHTML = checks.map(check => `
                <div class="check-item ${check.status}">
                    <div class="status">${check.status === 'success' ? '✅' : check.status === 'error' ? '❌' : '⚠️'}</div>
                    <div class="details">
                        <div class="label">${check.name}</div>
                        <div class="value">${check.details}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateSummary() {
            const success = checks.filter(c => c.status === 'success').length;
            const error = checks.filter(c => c.status === 'error').length;
            const summary = document.getElementById('summary');
            
            if (success + error === 0) return;
            
            const status = error === 0 ? 'success' : 'error';
            summary.className = 'summary ' + status;
            summary.style.display = 'block';
            summary.innerHTML = `
                <strong>Resultado:</strong> ${success}/${success + error} verificaciones exitosas
                ${error > 0 ? `<br>❌ ${error} error(es) encontrado(s) - Contacta al administrador` : '<br>✅ ¡Configuración correcta! Puedes usar cualquier nombre de carpeta'}
            `;
        }

        async function runAllChecks() {
            checks.length = 0;
            document.getElementById('summary').style.display = 'none';

            // 1. Verificar URL base
            const { origin, pathname } = window.location;
            const pathParts = pathname.split('/').filter(p => p);
            const projectFolder = pathParts[0] || 'raíz';
            
            addCheck(
                'URL del Proyecto',
                'success',
                `Carpeta detectada: <code>${projectFolder}</code><br>URL: <code>${origin}/${projectFolder}</code>`
            );

            // 2. Verificar carga de utils.js
            const utilsLoaded = typeof API_BASE_URL !== 'undefined';
            addCheck(
                'API Base URL detectada',
                utilsLoaded ? 'success' : 'error',
                utilsLoaded 
                    ? `<code>${API_BASE_URL}</code>` 
                    : 'No se pudo detectar la URL base de la API'
            );

            // 3. Verificar rutas dinámicas
            const expectedPath = `/${projectFolder}/src/api`;
            const actualPath = (API_BASE_URL || '').split('/').slice(-2).join('/');
            const routeCorrect = actualPath === expectedPath.substring(1) || API_BASE_URL.includes('/src/api');
            
            addCheck(
                'Ruta dinámica de API',
                routeCorrect ? 'success' : 'warning',
                `Esperado: <code>${expectedPath}</code><br>Base actual: <code>${API_BASE_URL}</code>`
            );

            // 4. Verificar archivo de configuración
            try {
                const configResponse = await fetch(`${API_BASE_URL}/status.php`);
                const configStatus = configResponse.ok ? 'success' : 'warning';
                addCheck(
                    'Conexión a API (Status)',
                    configStatus,
                    configStatus === 'success' 
                        ? '✅ API accesible' 
                        : `⚠️ Status: ${configResponse.status}`
                );
            } catch (e) {
                addCheck('Conexión a API (Status)', 'error', `Error: ${e.message}`);
            }

            updateSummary();
        }

        async function runApiTest() {
            // Mostrar prompt para credenciales
            const email = prompt('Email de prueba (ej: admin@classcontrol.com):');
            if (!email) return;
            
            const password = prompt('Contraseña:');
            if (!password) return;

            const loginUrl = `${API_BASE_URL}/auth/login.php`;
            console.log('[TEST] Intentando login en:', loginUrl);

            try {
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.text();
                console.log('[TEST] Respuesta:', data);

                let json;
                try {
                    json = JSON.parse(data);
                } catch {
                    console.error('[TEST] Respuesta no es JSON');
                    alert(`❌ Error: Respuesta no válida\nStatus: ${response.status}\nRespuesta: ${data.substring(0, 200)}`);
                    return;
                }

                if (json.success) {
                    alert(`✅ Login exitoso\n\nRedirect: ${json.data?.redirect || 'N/A'}\n\nVerifica que la ruta sea dinámica (incluya tu carpeta del proyecto)`);
                } else {
                    alert(`❌ Error en login: ${json.message}`);
                }
            } catch (error) {
                alert(`❌ Error de conexión: ${error.message}\n\nVerifica que:\n1. El servidor PHP esté corriendo\n2. La URL sea correcta: ${loginUrl}`);
            }
        }

        // Ejecutar verificación automática al cargar
        window.addEventListener('utils-loaded', () => {
            console.log('[VERIFICADOR] Utils cargado, ejecutando verificación...');
            runAllChecks();
        });

        // Si utils ya está cargado
        if (typeof API_BASE_URL !== 'undefined') {
            runAllChecks();
        } else {
            addCheck('Esperando carga...', 'warning', 'Cargando módulos...');
        }
    </script>

    <!-- Cargar scripts necesarios -->
    <script src="assets/js/app.js"></script>
</body>
</html>
